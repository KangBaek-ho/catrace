<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>고양이 레이스 · 축구</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ad4ff; touch-action: none; overscroll-behavior: none; font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .pill { position: fixed; padding: 6px 12px; border-radius: 10px; background: rgba(0,0,0,.45); color: #fff; font: 600 14px/1.4 system-ui, -apple-system, "Noto Sans KR", sans-serif; pointer-events: none; user-select: none; }
  #hud { left: 12px; top: calc(env(safe-area-inset-top, 0px) + 10px); }
  #hud small { display: block; font-weight: 400; opacity: .8; font-size: 12px; }
  #rinfo { left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px); font-size: 17px; display: none; text-align: center; }
  .btn { position: fixed; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 10px); padding: 9px 14px; border: 0; border-radius: 12px; background: #ff9800; color: #1b1200; font: 700 15px system-ui, -apple-system, "Noto Sans KR", sans-serif; cursor: pointer; }
  #exit { display: none; background: #eceff1; }
  #menu, #res, #shop, #nm { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,20,40,.55); z-index: 5; }
  .card { background: #fff; color: #1b2430; border-radius: 18px; padding: 18px; width: min(92vw, 380px); box-shadow: 0 10px 40px rgba(0,0,0,.35); text-align: center; max-height: 86vh; overflow: auto; }
  .card h2 { margin: 0 0 12px; font-size: 20px; }
  .card button { display: block; width: 100%; margin: 8px 0 0; padding: 13px; border: 0; border-radius: 12px; background: #eef3f8; font: 700 16px system-ui, -apple-system, "Noto Sans KR", sans-serif; color: #1b2430; cursor: pointer; text-align: left; }
  .card button small { display: block; font-weight: 400; font-size: 12px; opacity: .7; }
  .card button.go { background: #ff9800; text-align: center; }
  .card button.sub { text-align: center; background: #dfe6ee; }
  #tabs { display: flex; gap: 8px; margin-bottom: 8px; }
  #tabs button { margin: 0; text-align: center; padding: 9px; }
  #tabs button.on { background: #ff9800; }
  #sl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .it { background: #eef3f8; border-radius: 12px; padding: 10px 6px; font-size: 14px; font-weight: 700; }
  .it.on { outline: 3px solid #ff9800; }
  .it .ic { font-size: 30px; }
  .it span { display: block; font-size: 12px; font-weight: 400; opacity: .7; margin: 2px 0 4px; }
  .it button { margin: 4px 0 0; padding: 8px; text-align: center; font-size: 14px; }
  .it button.no { opacity: .45; }
  #nm input { width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #cfd8e3; border-radius: 12px; font: 600 17px system-ui, -apple-system, "Noto Sans KR", sans-serif; text-align: center; margin: 4px 0 2px; }
  #nn { font-size: 12px; opacity: .65; margin: 6px 0 0; }
  #sn { font-size: 13px; color: #d84315; min-height: 18px; margin: 8px 0 0; }
  #list { text-align: left; font-size: 15px; line-height: 1.8; margin: 8px 0 4px; }
  #cd { position: fixed; left: 0; right: 0; top: 28%; text-align: center; color: #fff; font: 900 96px/1 system-ui, -apple-system, "Noto Sans KR", sans-serif; text-shadow: 0 4px 18px rgba(0,0,0,.5); pointer-events: none; }
  #joy { position: fixed; left: calc(env(safe-area-inset-left, 0px) + 28px); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.55); display: none; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 2px 8px rgba(0,0,0,.3); pointer-events: none; }
  .abtn { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); width: 88px; height: 88px; border-radius: 50%; background: rgba(255,255,255,.28); border: 2px solid rgba(255,255,255,.7); color: #fff; font: 700 15px system-ui, -apple-system, "Noto Sans KR", sans-serif; display: none; touch-action: none; user-select: none; -webkit-user-select: none; align-items: center; justify-content: center; }
  .abtn:active { background: rgba(255,255,255,.5); }
  #jump { right: calc(env(safe-area-inset-right, 0px) + 24px); }
  #slide { right: calc(env(safe-area-inset-right, 0px) + 124px); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); width: 80px; height: 80px; }
  body.touch #joy { display: block; }
  body.touch .abtn { display: flex; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="pill">🐱 <span id="skinName">기본</span><small id="help"></small></div>
<div id="rinfo" class="pill"></div>
<button id="shopb" class="btn">🛒 상점</button>
<button id="nameb" class="btn" style="right:118px;background:#eceff1">✏️ 이름</button>
<button id="exit" class="btn">로비로</button>
<div id="cd"></div>
<div id="shop"><div class="card"><h2>🛒 스킨 상점 <small id="sg"></small></h2>
  <div id="sl"></div><p id="sn"></p><button class="sub" id="sx">닫기</button></div></div>
<div id="nm"><div class="card"><h2>✏️ 내 이름</h2><input id="ni" maxlength="10" placeholder="이름 (최대 10글자)" autocomplete="off"><p id="nn">고양이 게임에서 정한 이름과 같은 이름이에요 (같은 사이트 주소에서 열었을 때)</p><button class="go" id="ns">저장</button><button class="sub" id="nx">취소</button></div></div>
<div id="res"><div class="card"><h2 id="rt"></h2><div id="list"></div>
  <button class="go" id="again">한 판 더 (랜덤 코스)</button><button class="sub" id="lobby">로비로</button></div></div>
<div id="joy"><div id="knob"></div></div>
<div id="slide" class="abtn">슬라이딩</div>
<div id="jump" class="abtn">점프</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  const S = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(60, 1, 0.1, 400);
  S.add(new THREE.HemisphereLight(0xffffff, 0x8a9a7a, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7);
  sun.position.set(12, 24, 10); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 80 });
  S.add(sun); S.add(sun.target);

  // ---------- 고양이 (고양이 게임과 동일한 모델) ----------
  const mat = c => new THREE.MeshLambertMaterial({ color: c });
  const sp = new THREE.SphereGeometry(1, 16, 12);

  function mkCat(c, c2) {
    const cm = [], bm = [], gm = [], gl = [];
    const g = new THREE.Group();
    const m = (geo, col, x, y, z, sc, p) => {
      const o = new THREE.Mesh(geo, mat(col));
      if (col === c) cm.push(o.material);
      if (col === c2) bm.push(o.material);
      if (col === 0xe53935) { gm.push(o.material); gl.push(o); }
      o.position.set(x, y, z);
      if (sc) o.scale.set(sc[0], sc[1], sc[2]);
      o.castShadow = true;
      (p || g).add(o);
      return o;
    };
    m(sp, c, 0, 1.5, 0, [.75, 1, .6]); m(sp, c2, 0, 1.4, .3, [.5, .75, .4]); m(sp, c, 0, 2.8, 0, [.65, .6, .6]);
    const cone = new THREE.ConeGeometry(.22, .5, 4); m(cone, c, -.38, 3.35, 0); m(cone, c, .38, 3.35, 0);
    m(sp, 0x111111, -.22, 2.85, .5, [.09, .12, .06]); m(sp, 0x111111, .22, 2.85, .5, [.09, .12, .06]); m(sp, 0xff8fa3, 0, 2.7, .58, [.08, .06, .06]);
    const tail = new THREE.Group(); tail.position.set(0, 1, -.5); g.add(tail);
    m(new THREE.BoxGeometry(.2, .2, 1.2), c, 0, 0, -.6, null, tail);
    const arms = [-1, 1].map(s => {
      const a = new THREE.Group(); a.position.set(s * .85, 2.2, 0); g.add(a);
      m(new THREE.BoxGeometry(.3, .9, .3), c, 0, -.45, 0, null, a);
      return a;
    });
    const legs = [-1, 1].map(s => {
      const l = new THREE.Group(); l.position.set(s * .35, .9, 0); g.add(l);
      m(new THREE.BoxGeometry(.38, .9, .38), c, 0, -.45, 0, null, l);
      return l;
    });
    S.add(g);
    return { g, arms, legs, tail, cm, bm, gm, gl, acc: [], gacc: [], fl: [], rb: false };
  }

  // 스킨 목록 (고양이 게임의 SK 배열과 같은 순서 — 번호가 곧 저장값)
  const SK = [
    { n: '기본', c: 0x9aa0a6, c2: 0xf2f2f2 }, { n: '치즈', c: 0xffb02e, c2: 0xfff3c4 }, { n: '악마', c: 0x7a1020, c2: 0xd04a5a },
    { n: '빨간색 고양이', c: 0xe53935, c2: 0xffcdd2 }, { n: '주황색 고양이', c: 0xfb8c00, c2: 0xffe0b2 }, { n: '노란색 고양이', c: 0xfdd835, c2: 0xfffde7 },
    { n: '초록색 고양이', c: 0x43a047, c2: 0xdcedc8 }, { n: '하늘색 고양이', c: 0x4fc3f7, c2: 0xe1f5fe }, { n: '파란색 고양이', c: 0x1e5fd8, c2: 0xc5d8ff },
    { n: '보라색 고양이', c: 0x8e44ad, c2: 0xe8d4f2 }, { n: '검은색 고양이', c: 0x26262b, c2: 0x55555f }, { n: '얼룩 고양이', c: 0xf5f2ea, c2: 0xffffff },
    { n: '마법사 고양이', c: 0x3949ab, c2: 0xc5cae9 }, { n: '무지개 고양이', c: 0xff4081, c2: 0xffffff },
    { n: '크리스마스 고양이', c: 0xd32f2f, c2: 0xffffff }, { n: '지팡이 고양이', c: 0xffffff, c2: 0xe53935 }
  ];
  function xmasAcc(f, hat, cane) {
    const ad = (pa, geo, col, x, y, z, r) => {
      const o = new THREE.Mesh(geo, mat(col)); o.position.set(x, y, z);
      if (r) o.rotation.set(r[0], r[1], r[2]);
      o.castShadow = true; pa.add(o); f.acc.push([pa, o]);
    };
    if (hat) {
      ad(f.g, new THREE.ConeGeometry(.55, 1.1, 14), 0xd32f2f, 0, 3.9, 0, [-.12, 0, 0]);
      ad(f.g, new THREE.CylinderGeometry(.62, .62, .16, 16), 0xffffff, 0, 3.4, 0);
      ad(f.g, new THREE.SphereGeometry(.17, 8, 6), 0xffffff, 0, 4.48, -.12);
    }
    if (cane) {
      const a = f.arms[1];
      ad(a, new THREE.CylinderGeometry(.05, .05, 1.5, 8), 0xe53935, .32, -.55, .25);
      [-.2, -.6, -1].forEach(y => ad(a, new THREE.CylinderGeometry(.065, .065, .14, 8), 0xffffff, .32, y, .25));
      ad(a, new THREE.TorusGeometry(.2, .05, 6, 10, Math.PI), 0xe53935, .52, .2, .25);
    }
  }

  function applySkin(f, i) {
    const k = SK[i];
    f.cm.forEach(m => m.color.set(k.c)); f.bm.forEach(m => m.color.set(k.c2));
    f.acc.forEach(([pa, o]) => pa.remove(o)); f.acc = [];
    const add = (pa, geo, col, x, y, z, sc, r) => {
      const o = new THREE.Mesh(geo, mat(col)); o.position.set(x, y, z);
      if (sc) o.scale.set(sc[0], sc[1], sc[2]);
      if (r) o.rotation.set(r[0], r[1], r[2]);
      o.castShadow = true; pa.add(o); f.acc.push([pa, o]); return o;
    };
    const bx = (w, h, d) => new THREE.BoxGeometry(w, h, d), cn = (r, h) => new THREE.ConeGeometry(r, h, 6);
    if (i === 1) {
      [-.18, 0, .18].forEach(x => add(f.g, bx(.07, .05, .35), 0xd9780f, x, 3.38, .15));
      [1.1, 1.5, 1.9].forEach(y => add(f.g, bx(.9, .08, .05), 0xd9780f, 0, y, -.58));
      add(f.tail, bx(.22, .22, .3), 0xd9780f, 0, 0, -1.25);
    }
    if (i === 2) {
      [-1, 1].forEach(s => {
        add(f.g, cn(.12, .45), 0xff1744, s * .2, 3.5, .2, null, [0, 0, -s * .25]);
        add(f.g, sp, 0xff0000, s * .22, 2.85, .55, [.07, .1, .05]);
        add(f.g, bx(.08, 1.3, 1), 0x2a0a2a, s * .75, 2.3, -.75, null, [0, s * .5, s * .6]);
      });
      add(f.tail, cn(.2, .4), 0xff1744, 0, 0, -1.35, null, [-Math.PI / 2, 0, 0]);
    }
    if (i === 14) xmasAcc(f, 1, 1);
    if (i === 15) {
      [1.1, 1.5, 1.9].forEach(y => add(f.g, bx(.9, .09, .05), 0xe53935, 0, y, -.58));
      add(f.tail, bx(.23, .23, .3), 0xe53935, 0, 0, -1.25);
      xmasAcc(f, 0, 1);
    }
    f.rb = i === 13; // 무지개: 털색이 계속 변함
    if (i === 10) {
      [-1, 1].forEach(q => {
        add(f.g, sp, 0xffd600, q * .22, 2.86, .53, [.12, .15, .05]);
        add(f.g, sp, 0x111111, q * .22, 2.86, .57, [.03, .1, .03]);
      });
    }
    if (i === 11) {
      add(f.g, sp, 0x222222, -.7, 1.8, .1, [.1, .28, .22]); add(f.g, sp, 0xff9800, .72, 1.2, -.1, [.1, .25, .28]);
      add(f.g, sp, 0x222222, -.25, 1.7, -.55, [.3, .25, .08]); add(f.g, sp, 0xff9800, .3, 1.2, -.54, [.28, .25, .08]);
      add(f.g, sp, 0x222222, -.25, 3.33, .1, [.22, .08, .22]); add(f.g, sp, 0xff9800, .62, 2.85, .05, [.08, .25, .25]);
      add(f.tail, bx(.23, .23, .25), 0x222222, 0, 0, -.4); add(f.tail, bx(.23, .23, .25), 0xff9800, 0, 0, -.95);
    }
    if (i === 12) {
      const cy = (a, b, h) => new THREE.CylinderGeometry(a, b, h, 18);
      add(f.g, cy(1, 1, .07), 0x24135f, 0, 3.5, 0); add(f.g, new THREE.ConeGeometry(.62, 1.4, 18), 0x2e1a7a, 0, 4.2, 0); add(f.g, cy(.63, .66, .16), 0xffc107, 0, 3.62, 0);
      add(f.g, new THREE.OctahedronGeometry(.16), 0xffeb3b, 0, 3.95, .5);
      add(f.g, bx(1.5, 1.7, .08), 0x311b92, 0, 1.7, -.68, null, [.12, 0, 0]);
      [[-.3, 2.0], [.35, 1.45], [0, 1.0]].forEach(([x, y]) => add(f.g, sp, 0xffeb3b, x, y, -.74, [.08, .08, .04]));
    }
    if (i === 13) {
      [0xff1744, 0xff9100, 0xffea00, 0x00e676, 0x2979ff, 0x651fff, 0xd500f9].forEach((c, j) => {
        const d = -.75 + j * .25, r = Math.sqrt(1 - d * d);
        add(f.g, bx(2 * .75 * r * .85, .17, .07), c, 0, 1.5 + d, -r * .6 - .01);
      });
      [0xff1744, 0xffea00, 0x2979ff].forEach((c, j) => add(f.tail, bx(.23, .23, .4), c, 0, 0, -.4 - j * .4));
    }
  }



  // ---------- 저장값 (고양이 게임) ----------
  function loadSaved() {
    let sk = 0;
    try {
      sk = clamp(+localStorage.getItem('catSk') || 0, 0, SK.length - 1);
      if (!JSON.parse(localStorage.getItem('catOwn') || '[1,0,0]')[sk]) sk = 0;
    } catch (e) {}
    return { sk };
  }
  const SKP = [0, 500, 10000, 500, 500, 500, 500, 500, 500, 500, 500, 500, 1000, 1000, 0, 0];
  const SKI = ['🐱', '🧀', '😈', '🔴', '🟠', '🟡', '🟢', '☁️', '🔵', '🟣', '⚫', '🐄', '🧙', '🌈', '🎅', '🍭'];
  SK.forEach((k, i) => { k.p = SKP[i]; k.ic = SKI[i]; k.q = i > 13; });
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
  const won = n => n.toLocaleString('ko-KR');
  function readState() {
    const inf = lsGet('catInf', '0') === '1'; let gold = +lsGet('catGold', 0) || 0; if (!isFinite(gold) || gold < 0) gold = 0;
    let own = [1, 0, 0];
    try { own = JSON.parse(lsGet('catOwn', '[1,0,0]')); } catch (e) {}
    while (own.length < SK.length) own.push(0); own[0] = 1;
    return { inf, gold, own };
  }
  const money = st => st.inf ? '∞' : won(st.gold);
  function refreshSkin() {
    const { sk } = loadSaved();
    applySkin(R[0].cat, sk);
    $('skinName').textContent = myName() + ' · ' + SK[sk].n + ' · 💰 ' + money(readState()) + '원';
    if (R[0].tag) drawTag(R[0]);
  }
  function renderShop(note) {
    const st = readState(), cur = loadSaved().sk;
    $('sg').textContent = '💰 ' + money(st) + '원';
    $('sl').innerHTML = SK.map((k, i) => i).filter(i => !SK[i].q || st.own[i]).sort((a, b) => SK[a].p - SK[b].p || a - b).map(i => {
      const k = SK[i], eq = i === cur, has = st.own[i];
      const btn = eq ? '<button disabled>✔ 장착중</button>' : has ? '<button data-a="equip" data-i="' + i + '">장착하기</button>'
        : '<button data-a="buy" data-i="' + i + '" class="' + (st.inf || st.gold >= k.p ? '' : 'no') + '">구매하기</button>';
      return '<div class="it' + (eq ? ' on' : '') + '"><div class="ic">' + k.ic + '</div>' + k.n + '<span>' + (k.p ? '💰 ' + won(k.p) + '원' : '무료') + '</span>' + btn + '</div>';
    }).join('');
    $('sn').textContent = note || '';
  }
  $('shopb').onclick = () => { $('shop').style.display = 'flex'; renderShop(''); };
  $('sx').onclick = () => { $('shop').style.display = 'none'; };
  $('nameb').onclick = () => { $('ni').value = (lsGet('catName', '') || '').slice(0, 10); $('nm').style.display = 'flex'; };
  $('nx').onclick = () => { $('nm').style.display = 'none'; };
  $('ns').onclick = () => { try { localStorage.setItem('catName', $('ni').value.trim().slice(0, 10)); } catch (e) {} $('nm').style.display = 'none'; refreshSkin(); };
  $('sl').onclick = e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const i = +b.dataset.i, k = SK[i], st = readState(), buy = b.dataset.a === 'buy' && !st.own[i];
    if (buy) {
      if (!st.inf && st.gold < k.p) { renderShop('돈이 부족해요! ' + won(k.p - st.gold) + '원이 더 필요해요'); return; }
      if (!st.inf) st.gold -= k.p; st.own[i] = 1;
    } else if (!st.own[i]) return;
    try { localStorage.setItem('catOwn', JSON.stringify(st.own)); localStorage.setItem('catGold', st.gold); localStorage.setItem('catSk', i); } catch (err) {}
    refreshSkin(); renderShop(buy ? '구매 완료! 바로 장착했어요 🎉' : '');
  };

  const ballGeo = (() => {
    const g = new THREE.IcosahedronGeometry(1, 1), p = g.attributes.position, col = new Float32Array(p.count * 3);
    for (let v = 0; v < p.count; v++) { const f = (v / 3) | 0, d = f % 5 === 2 ? .12 : 1; col[v * 3] = col[v * 3 + 1] = col[v * 3 + 2] = d; }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3)); return g;
  })();

  // ---------- 달리는 고양이들 (0번 = 나) ----------
  const NAMES = ['나', '뭉치', '나비', '치즈', '콩이', '보리', '두부', '모모', '초코', '밤이', '별이', '하늘', '구름', '쿠키', '라떼', '망고', '젤리', '호두'];
  const R = NAMES.map((name, i) => {

      const sx = Math.min(7, C.fw / (n + 1)), hx = (k - (n - 1) / 2) * sx, hz = side * (8 + 5 * (k % 3));
      tx = clamp(hx + (B.x - hx) * .3, -C.cx, C.cx); tz = clamp(hz + (B.z - hz) * .5, -C.cz, C.cz);
    }
    const dx = tx - s.x, dz = tz - s.z, d = Math.hypot(dx, dz);
    if (d > .6) { const sp = Math.min(1, d / 2) * r.spd * (keeper ? .75 : press ? 1 : .85); o.mx = dx / d * sp; o.mz = dz / d * sp; }
    const rng = Math.max(18, Math.min(34, C.fl * .45)), nearWall = Math.abs(B.x) > C.fw / 2 - 3 || Math.abs(B.z) > C.fl / 2 - 3;
    if (press && dB < 2.7 && (bh < -.2 || keeper || nearWall) && s.kcd <= 0 && (keeper || gl < rng || Math.random() < dt * .25) && Math.random() < dt * (4 + 4 * r.skill)) {
      const ax = (Math.random() - .5) * C.gw * (1.4 - r.skill * .7), ux = ax - B.x, uz = gz - B.z, ul = Math.hypot(ux, uz) || 1;
      o.kick = true; o.kdir = [ux / ul, uz / ul];
    }
    if (B.y > 2.6 && dB < 4 && s.g && Math.random() < dt * 3) o.jump = true;
    return o;
  }
  function doKick(r, inp, dt) {
    const s = r.st, B = C.ball; s.kcd = Math.max(0, s.kcd - dt); s.kick = Math.max(0, s.kick - dt);
    if (!inp.kick || s.kcd > 0 || mode !== 'race') return;
    s.kcd = .45; s.kick = .25;
    const d = Math.hypot(B.x - s.x, B.z - s.z); if (d > 3.4 || B.y > 3.4) return;
    let ux, uz; if (inp.kdir) { ux = inp.kdir[0]; uz = inp.kdir[1]; s.face = Math.atan2(ux, uz); } else { ux = Math.sin(s.face); uz = Math.cos(s.face); }
    const pw = r.ai ? 20 + 6 * r.skill : 24; B.vx = ux * pw; B.vz = uz * pw; B.vy = 4.5; B.y = Math.max(B.y, 1.05); B.last = r;
  }
  function goalScored(t) {
    C.sc[t]++; mode = 'goal'; C.goalT = 2.4; const w = C.ball.last, who = w && w.team === t ? w : null;
    if (who) who.goals++;
    $('cd').innerHTML = '<div style="font-size:60px">⚽ GOAL!</div><div style="font-size:24px;font-weight:700">' + (t === 0 ? '🔵 ' : '🔴 ') + (who ? esc(nameOf(who)) : '자책골') + '</div>';
    if (C.sc[t] >= C.win) C.over = t;
  }
  function endSoccer() {
    mode = 'done'; const win = C.over === 0, reward = win ? 300 : 50, total = giveReward(reward); refreshSkin();
    $('rt').textContent = (win ? '🏆 승리!' : '😿 패배') + ' · ' + C.sc[0] + ' : ' + C.sc[1];
    const sc = ACT.filter(r => r.goals > 0).sort((a, b) => b.goals - a.goals);
    $('list').innerHTML = '<b>💰 +' + won(reward) + '원' + (total !== null ? ' (보유 ' + won(total) + '원)' : '') + '</b><br>🔵 ' + C.sc[0] + ' : ' + C.sc[1] + ' 🔴<br>' +
      (sc.length ? sc.map(r => (r.team ? '🔴 ' : '🔵 ') + (r.i ? esc(r.name) : '<b>' + esc(myName()) + '</b>') + ' ⚽ ' + r.goals + '골').join('<br>') : '');
    $('res').style.display = 'flex';
  }
  function socUpdate(dt, now) {
    const B = C.ball, FW = C.fw, FL = C.fl, GW = C.gw;
    if (mode === 'race') {
      ACT.forEach(r => {
        const s = r.st, dx = B.x - s.x, dz = B.z - s.z, d = Math.hypot(dx, dz), rr = 1.55;
        if (d < rr && B.y - 1 < s.y + 3 && B.y + 1 > s.y + .2) {
          const nx = d > .001 ? dx / d : Math.sin(s.face), nz = d > .001 ? dz / d : Math.cos(s.face);
          B.x = s.x + nx * rr; B.z = s.z + nz * rr;
          const bvn = B.vx * nx + B.vz * nz, cvn = s.vx * nx + s.vz * nz, tg = Math.max(0, cvn * 1.2 + 2.5);
          if (bvn < tg) { B.vx += nx * (tg - bvn); B.vz += nz * (tg - bvn); }
          B.last = r;
        }
      });
    }
    for (let a = 0; a < ACT.length; a++) for (let b = a + 1; b < ACT.length; b++) {
      const p = ACT[a].st, q = ACT[b].st; if (Math.abs(p.y - q.y) > 2.5) continue;
      const dx = q.x - p.x, dz = q.z - p.z, d = Math.hypot(dx, dz);
      if (d < 1.1 && d > .001) { const m = (1.1 - d) / 2 / d; p.x -= dx * m; p.z -= dz * m; q.x += dx * m; q.z += dz * m; }
    }
    if (mode === 'race') {
      const slow = Math.hypot(B.vx, B.vz) < .8, edge = Math.abs(B.x) > FW / 2 - 3 || (Math.abs(B.z) > FL / 2 - 3 && Math.abs(B.x) > GW / 2 - 1);
      C.idle = slow && edge ? (C.idle || 0) + dt : 0;
      if (C.idle > 3) { C.idle = 0; B.x *= .45; B.z *= .45; B.vx = B.vz = 0; B.vy = 3; }
    }
    B.vy -= 26 * dt; B.y += B.vy * dt;
    if (B.y < 1) { B.y = 1; B.vy = B.vy < -2.5 ? -B.vy * .55 : 0; }
    const fr = Math.pow(B.y <= 1.02 ? .45 : .9, dt); B.vx *= fr; B.vz *= fr;
    B.x += B.vx * dt; B.z += B.vz * dt;
    if (Math.abs(B.x) > FW / 2 - 1 && Math.abs(B.z) <= FL / 2 - 1) { B.x = Math.sign(B.x) * (FW / 2 - 1); B.vx *= -.75; }
    const az = Math.abs(B.z);
    if (az > FL / 2 - 1) {
      if (Math.abs(B.x) < GW / 2 - .2 && B.y < 4.1) {
        if (az > FL / 2 + .2 && mode === 'race') goalScored(B.z < 0 ? 0 : 1);
        if (az > FL / 2 + 2.6) { B.z = Math.sign(B.z) * (FL / 2 + 2.6); B.vz *= -.3; }
        if (az > FL / 2 && Math.abs(B.x) > GW / 2 - 1.1) { B.x = Math.sign(B.x) * (GW / 2 - 1.1); B.vx *= -.3; }
      } else if (az < FL / 2 + .5) { B.z = Math.sign(B.z) * (FL / 2 - 1); B.vz *= -.75; if (Math.abs(B.x) > FW / 2 - 1) { B.x = Math.sign(B.x) * (FW / 2 - 1); B.vx *= -.75; } }
      else { B.z = Math.sign(B.z) * (FL / 2 - 1); B.vz *= -.75; }
    }
    B.m.position.set(B.x, B.y, B.z); B.m.rotation.x += B.vz * dt; B.m.rotation.z -= B.vx * dt;
  }
  function toLobby() {
    curCourse = null; setAct(1); build('lobby'); resetRacers(false); mode = 'lobby'; $('cd').textContent = ''; $('slide').textContent = '슬라이딩';
    $('res').style.display = 'none'; $('shopb').style.display = $('nameb').style.display = 'block'; $('exit').style.display = 'none'; $('rinfo').style.display = 'none'; refreshSkin();
  }
  $('exit').onclick = toLobby; $('lobby').onclick = toLobby;
  $('again').onclick = () => lastGame.k === 'soc' ? startSoccer(lastGame.n) : startRace(randomCourse(), lastGame.n);
  const prog = r => r.st.fin ? 1e6 - r.st.fin : r.st.z;
  function giveReward(n) {
    try { let g = +localStorage.getItem('catGold') || 0; if (!isFinite(g) || g < 0) g = 0; g += n; localStorage.setItem('catGold', g); return g; } catch (e) { return null; }
  }
  function endRace() {
    mode = 'done'; endT = 0; $('cd').innerHTML = '';
    const order = ACT.slice().sort((a, b) => prog(b) - prog(a)), rank = order.indexOf(R[0]) + 1, reward = rewardFor(rank);
    const total = giveReward(reward); refreshSkin();
    const sc = [0, 0], best = [99, 99]; order.forEach((r, k) => { sc[r.team] += k + 1; best[r.team] = Math.min(best[r.team], k + 1); });
    let teamLine = '';
    if (nAct >= 4) { const w = sc[0] < sc[1] || (sc[0] === sc[1] && best[0] < best[1]) ? 0 : 1; teamLine = '<br>' + (w === 0 ? '🔵 우리 팀 승리!' : '🔴 상대 팀 승리') + ' (순위 합계 ' + sc[0] + ' : ' + sc[1] + ', 낮을수록 좋아요)'; }
    $('rt').textContent = (rank === 1 ? '🥇 1등!' : '🏁 ' + rank + '등') + ' · ' + (R[0].st.fin ? R[0].st.fin.toFixed(1) + '초' : Math.round(clamp(R[0].st.z / C.L, 0, 1) * 100) + '% 지점');
    $('list').innerHTML = '<b>💰 +' + won(reward) + '원' + (total !== null ? ' (보유 ' + won(total) + '원)' : '') + '</b>' + teamLine + '<br>' +
      order.map((r, k) => (k + 1) + '. ' + (r.team ? '🔴 ' : '🔵 ') + (r.i ? esc(r.name) : '<b>' + esc(myName()) + '</b>') + ' — ' + (r.st.fin ? r.st.fin.toFixed(1) + '초' : Math.round(clamp(r.st.z / C.L, 0, 1) * 100) + '%')).join('<br>');
    $('res').style.display = 'flex';
  }

  // ---------- 포즈 ----------
  function pose(r, now) {
    const c = r.cat, s = r.st, lane = C.mode === 'L' && curCourse;
    c.g.rotation.order = 'YXZ'; c.g.rotation.y = s.face;
    c.g.position.set(s.x, s.y + (lane ? (curCourse === 'car' ? -.6 : curCourse === 'off' ? -.3 : -.45) : 0), s.z);
    if (lane) {
      c.legs.forEach(l => l.rotation.x = -1.4);
      c.arms.forEach((a, k) => a.rotation.x = curCourse === 'boat' ? -.6 + Math.sin(now / 130 + k * 3) * .7 : -1);
      c.g.rotation.x = s.boost > 0 ? .3 : 0;
      const v = curCourse === 'sled' ? r.sled : curCourse === 'car' ? r.car : curCourse === 'off' ? r.off : r.boat;
      v.position.set(s.x, s.y, s.z); v.rotation.z = Math.sin(now / 300 + r.i) * .05; v.rotation.x = curCourse === 'sled' ? Math.atan(C.sl) * -1 : 0; if (curCourse === 'car') v.rotation.z = 0;
    } else if (s.slide > 0) {
      c.g.rotation.x = 1.15; c.g.position.y = s.y - .1; c.legs.forEach(l => l.rotation.x = 0); c.arms.forEach(a => a.rotation.x = -3);
    } else {
      const air = !s.g, sw = !air ? Math.sin(s.walk) * .8 * Math.min(1, Math.hypot(s.vx, s.vz) / 5) : 0;
      c.g.rotation.x = 0; c.legs[0].rotation.x = air ? -.5 : sw; c.legs[1].rotation.x = air ? .5 : -sw;
      c.arms[0].rotation.x = air ? -2.4 : -sw * .8; c.arms[1].rotation.x = air ? -2.4 : sw * .8;
      if (s.kick > 0) c.legs[0].rotation.x = -1.8;
    }
    c.tail.rotation.y = Math.sin(now / 280) * .3;
    c.g.visible = r.i === 0 || !!curCourse ? !(s.stun > 0 && ((s.t * 20) | 0) % 2) : false;
    if (c.rb) { const h = (now / 2500) % 1; c.cm.forEach(m => m.color.setHSL(h, .85, .58)); c.bm.forEach(m => m.color.setHSL((h + .5) % 1, .7, .86)); }
    c.fl.forEach((m, i) => m.scale.set(1, 1 + Math.sin(now / 90 + i * 2) * .18, 1));
  }

  function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  build('lobby'); resetRacers(false);

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (mode === 'count') { cdT -= dt; $('cd').innerHTML = (cdT > .2 ? Math.ceil(cdT - .2) : 'GO!') + '<div style="font-size:26px;font-weight:700">' + NAMEC[curCourse] + '</div>'; if (cdT <= 0) { mode = 'race'; $('cd').textContent = ''; } }
    else if (mode === 'race') {
      if (curCourse !== 'soccer') {
        raceT += dt;
        if (endT > 0) endT -= dt;
        if ((placed > 0 && endT <= 0) || ACT.every(r => r.st.fin)) endRace();
      }
    }
    else if (mode === 'goal') {
      C.goalT -= dt;
      if (C.goalT <= 0) { $('cd').innerHTML = ''; if (C.over !== undefined) endSoccer(); else { kickoff(); mode = 'race'; } }
    }
    if (bannerT > 0 && mode === 'race') { bannerT -= dt; $('cd').innerHTML = bannerT > 0 ? '<div style="font-size:30px;font-weight:800">🏁 ' + bannerName + ' 도착!<br>20초 후 경기 종료</div>' : ''; }
    updateMv(now / 1000, dt);
    const tl = R[0].st.stand && R[0].st.stand.tele;
    if (mode === 'lobby' && tl && !uiOpen()) { teleT += dt; if (teleT > .35) { tl.k === 'soc' ? startSoccer(tl.n) : startRace(randomCourse(), tl.n); } } else teleT = 0;
    ACT.forEach(r => {
      if (!curCourse && r.i) return;
      const live = (mode === 'race' || mode === 'lobby') && !(r.i === 0 && r.st.fin);
      let inp = { mx: 0, mz: 0, lat: 0, jump: false, slide: false };
      if (live) inp = r.ai ? aiInput(r, dt) : playerInput();
      if (r.st.fin && r.i) inp = { mx: 0, mz: 0, lat: 0, jump: false, slide: false };
      if (curCourse === 'soccer') { inp.kick = !!(inp.slide || inp.kick); inp.slide = false; }
      C.mode === 'L' ? stepL(r, inp, dt, now) : stepW(r, inp, dt);
      if (curCourse === 'soccer') doKick(r, inp, dt);
      if (curCourse && curCourse !== 'soccer' && !r.st.fin && mode !== 'count' && r.st.z >= C.L) { r.st.fin = raceT || .01; r.place = ++placed; if (placed === 1) { endT = 20; bannerT = 2.5; bannerName = r.i ? r.name : '나'; } }
      pose(r, now);
    });
    if (curCourse === 'soccer') socUpdate(dt, now);
    const P = R[0].st;
    if (curCourse === 'soccer') $('rinfo').textContent = '🔵 ' + C.sc[0] + ' : ' + C.sc[1] + ' 🔴 · ' + C.n + ':' + C.n + ' · ' + C.win + '점 먼저!';
    else if (curCourse) {
      const rank = 1 + ACT.filter(r => prog(r) > prog(R[0])).length;
      $('rinfo').textContent = NAMEC[curCourse] + ' · 🏁 ' + rank + '/' + nAct + ' · ' + raceT.toFixed(1) + '초' + (endT > 0 && mode === 'race' ? ' · ⏱ ' + Math.ceil(endT) + '초' : '') + ' · ' + clamp(Math.round(P.z / C.L * 100), 0, 100) + '%';
    }
    const lane = C.mode === 'L' && curCourse, D = lane ? (curCourse === 'car' ? 15 : 16) : curCourse === 'soccer' ? 16 : 13, cp = Math.cos(pitch);
    cam.position.set(P.x + Math.sin(yaw) * cp * D, P.y * .6 + 2 + Math.sin(pitch) * D, P.z + Math.cos(yaw) * cp * D);
    cam.lookAt(P.x, P.y + 2, P.z);
    sun.position.set(P.x + 12, P.y + 24, P.z + 10); sun.target.position.set(P.x, P.y, P.z);
    renderer.render(S, cam);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
